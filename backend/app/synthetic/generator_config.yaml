tms_defects:
  count_per_section_range: [2, 5]
  severity_weights: [0.3, 0.3, 0.2, 0.1, 0.1] # severity 1 to 5
  types: ["track", "bridge", "point_crossing"]
  speed_restriction_range: [20.0, 75.0]

smms_faults:
  count_per_section_range: [1, 4]
  severity_weights: [0.4, 0.3, 0.15, 0.1, 0.05]
  types: ["signal", "interlocking", "telecom"]

tdms_faults:
  count_per_section_range: [1, 3]
  severity_weights: [0.35, 0.35, 0.15, 0.1, 0.05]
  types: ["ohe", "substation", "power_block"]

bdms_requests:
  count_per_section_range: [2, 4]
  departments: ["engineering", "signal_telecom", "traction"]
  crew_required_range: [2, 10]
  machine_required_probability: 0.6
